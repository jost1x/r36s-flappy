name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  command:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.parse.outputs.enabled }}
      pc: ${{ steps.parse.outputs.pc }}
      r36s: ${{ steps.parse.outputs.r36s }}
      deploy: ${{ steps.parse.outputs.deploy }}
    steps:
      - id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          pc=false
          r36s=false
          deploy=false

          if [[ "$MESSAGE" == *"(release)"* || "$MESSAGE" == *"(deploy)"* ]]; then
            pc=true
            r36s=true
          fi
          if [[ "$MESSAGE" == *"(release:pc)"* || "$MESSAGE" == *"(deploy:pc)"* ]]; then
            pc=true
          fi
          if [[ "$MESSAGE" == *"(release:r36s)"* || "$MESSAGE" == *"(deploy:r36s)"* ]]; then
            r36s=true
          fi
          if [[ "$MESSAGE" == *"(deploy)"* || "$MESSAGE" == *"(deploy:pc)"* || "$MESSAGE" == *"(deploy:r36s)"* ]]; then
            deploy=true
          fi

          if [[ "$pc" == true || "$r36s" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pc=$pc" >> "$GITHUB_OUTPUT"
          echo "r36s=$r36s" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    needs: command
    if: github.event_name == 'pull_request' || needs.command.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang-format clang-tidy libsdl2-dev python3
      - name: Format check
        run: make -f Makefile-cpp format
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Lint
        run: clang-tidy -p build --warnings-as-errors='*' $(find src -name '*.cpp' -o -name '*.h' | sort)
      - name: Build and test
        run: cmake --build build -j$(nproc) && ctest --test-dir build --output-on-failure

  build-pc:
    runs-on: ubuntu-latest
    needs: [command, validate]
    if: needs.command.outputs.pc == 'true' && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libsdl2-dev python3
      - name: Build PC binary
        run: cmake -S . -B build-pc -DCMAKE_BUILD_TYPE=Release -DEMBED_ASSETS=ON -DBUILD_TESTING=OFF && cmake --build build-pc -j$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r36s-flappy-pc
          path: build-pc/r36s-flappy
          retention-days: 30

  build-r36s:
    runs-on: ubuntu-latest
    needs: [command, validate]
    if: needs.command.outputs.r36s == 'true' && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 binary
        run: make r36s
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r36s-flappy-r36s
          path: bin/r36s-arm64/r36s-flappy
          retention-days: 30

  publish-deploy:
    runs-on: ubuntu-latest
    needs: [command, build-pc, build-r36s]
    if: always() && needs.command.outputs.deploy == 'true' && (needs.build-pc.result == 'success' || needs.build-r36s.result == 'success')
    steps:
      - name: Download PC artifact
        if: needs.build-pc.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: r36s-flappy-pc
          path: release-artifacts/pc
      - name: Download R36S artifact
        if: needs.build-r36s.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: r36s-flappy-r36s
          path: release-artifacts/r36s
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.sha }}
          name: Deploy ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/**
